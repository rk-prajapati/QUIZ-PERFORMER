<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login – Exam Portal</title>
  <meta name="description" content="Modern exam portal for creating quizzes and attempting timed tests with results, leaderboards, and certificates.">
  <link rel="icon" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="auth-wrap">
    <div class="card auth-card">
      <h1><i class="fa-solid fa-right-to-bracket"></i> Welcome Back</h1>
      <p class="sub">Sign in to continue to your dashboard</p>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email address</label>
          <input class="form-control" id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input class="form-control" id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>
        <label class="checkbox mb-2"><input type="checkbox" id="remember"> Remember my email</label>
        <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
      </form>
      <div class="auth-divider"><span>OR</span></div>
      <div class="auth-switch">New here? <a href="register.html">Create an account</a></div>
      <div class="auth-switch"><a href="admin.html"><i class="fa-solid fa-shield-halved"></i> Administrator access</a></div>
    </div>
  </main>

  <script src="storage.js"></script>
  <script src="validation.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script>prefillRemembered();</script>
</body>
</html>
